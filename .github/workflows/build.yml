name: Build

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (Release)
        run: dotnet build "Casualties Hub.slnx" -c Release -warnaserror

      - name: Publish Hub (single-file EXE)
        run: dotnet publish "Casualties Hub/Casualties Hub.csproj" -c Release --no-build -o publish/hub

      - name: Upload Hub EXE
        uses: actions/upload-artifact@v4
        with:
          name: casualties-hub-exe
          path: "publish/hub/Casualties Hub.exe"
          if-no-files-found: error
