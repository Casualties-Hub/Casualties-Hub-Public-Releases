name: Build

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (Release)
        run: dotnet build "Casualties Hub Linux/Casualties Hub Linux.csproj" -c Release -warnaserror

      - name: Test
        run: dotnet test "Casualties Hub Linux.Tests/Casualties Hub Linux.Tests.csproj" -c Release

      - name: Publish (linux-x64)
        run: dotnet publish "Casualties Hub Linux/Casualties Hub Linux.csproj" -c Release -r linux-x64 -o publish/linux

      - name: Publish (win-x64)
        run: dotnet publish "Casualties Hub Linux/Casualties Hub Linux.csproj" -c Release -r win-x64 -o publish/windows

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: casualties-hub-linux
          path: publish/linux/casualties-hub
          if-no-files-found: error

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: casualties-hub-windows
          path: publish/windows/casualties-hub.exe
          if-no-files-found: error
