name: Build

# Builds and tests on both platforms, then produces the single-file binaries and attaches them
# to the run as artifacts. Nothing here creates a tag or a GitHub Release; releases are a manual
# maintainer action.

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The solution, not the app project alone, so the tests compile under -warnaserror too.
      - name: Build (Release)
        run: dotnet build "Casualties Hub.slnx" -c Release -warnaserror

      - name: Test
        run: dotnet test "Casualties Hub.Tests/Casualties Hub.Tests.csproj" -c Release --no-build

      # The Windows binary can only be started on Windows, so its self-test lives here.
      - name: Self-test the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish "Casualties Hub/Casualties Hub.csproj" -c Release -r win-x64 -o publish/windows
          & "publish/windows/casualties-hub.exe" --selftest

  package:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish (linux-x64)
        run: dotnet publish "Casualties Hub/Casualties Hub.csproj" -c Release -r linux-x64 -o publish/linux

      # Constructs every page and dialog headlessly; catches XAML and resource breaks a compile
      # cannot. Needs no display.
      - name: Self-test the Linux binary
        run: ./publish/linux/casualties-hub --selftest

      - name: Publish (win-x64)
        run: dotnet publish "Casualties Hub/Casualties Hub.csproj" -c Release -r win-x64 -o publish/windows

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: casualties-hub-linux
          path: publish/linux/casualties-hub
          if-no-files-found: error

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: casualties-hub-windows
          path: publish/windows/casualties-hub.exe
          if-no-files-found: error
